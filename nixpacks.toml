[phases.setup]
nixPkgs = ["python312", "gcc", "postgresql"]
cmds = [
    "useradd -m -s /bin/bash appuser",
    "mkdir -p /app && chown -R appuser:appuser /app"
]

[phases.install]
cmds = [
    "python -m venv /app/venv",
    "chown -R appuser:appuser /app/venv",
    "su appuser -c '. /app/venv/bin/activate && pip install --upgrade pip setuptools wheel'",
    "su appuser -c '. /app/venv/bin/activate && pip install -r requirements.txt'"
]

[start]
cmd = "su appuser -c '. /app/venv/bin/activate && gunicorn --bind 0.0.0.0:${PORT:-8080} --timeout 120 app:app'"
